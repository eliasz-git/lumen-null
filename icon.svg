<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#59ffb0" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#59ffb0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#59ffb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59ffb0"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer bezel -->
  <circle cx="64" cy="64" r="56" fill="#0a0d12" stroke="#2a333d" stroke-width="2"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#1a2028" stroke-width="1"/>

  <!-- Scope crosshair ticks -->
  <g stroke="#59ffb0" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <line x1="64" y1="14" x2="64" y2="22"/>
    <line x1="64" y1="106" x2="64" y2="114"/>
    <line x1="14" y1="64" x2="22" y2="64"/>
    <line x1="106" y1="64" x2="114" y2="64"/>
    <line x1="27" y1="27" x2="34" y2="34"/>
    <line x1="94" y1="94" x2="101" y2="101"/>
    <line x1="94" y1="27" x2="101" y2="34"/>
    <line x1="27" y1="94" x2="34" y2="101"/>
  </g>

  <!-- Scan sweep arc -->
  <path d="M 64 64 A 34 34 0 0 1 98 64" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Lidar ping dot -->
  <circle cx="98" cy="64" r="4" fill="#59ffb0" filter="url(#glow)"/>

  <!-- Center pupil -->
  <circle cx="64" cy="64" r="12" fill="#0a0d12" stroke="#59ffb0" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="5" fill="#59ffb0"/>

  <!-- Subtle background lattice (scanned points) -->
  <circle cx="40" cy="38" r="1.6" fill="#59ffb0" opacity="0.25"/>
  <circle cx="90" cy="42" r="1.2" fill="#59ffb0" opacity="0.2"/>
  <circle cx="36" cy="86" r="1.4" fill="#59ffb0" opacity="0.22"/>
  <circle cx="92" cy="82" r="1.0" fill="#59ffb0" opacity="0.18"/>
  <circle cx="64" cy="30" r="1.0" fill="#59ffb0" opacity="0.2"/>
</svg>
