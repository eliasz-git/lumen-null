<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#59ffb0" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#59ffb0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#59ffb0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" fill="#05070a" rx="22"/>
  <!-- Outer scan pulse ring -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#59ffb0" stroke-width="2.5" opacity="0.5"/>
  <!-- Inner scan core -->
  <circle cx="64" cy="64" r="10" fill="#59ffb0"/>
  <!-- Glow behind core -->
  <circle cx="64" cy="64" r="14" fill="url(#glow)"/>
  <!-- Scatter dots (lidar points) -->
  <circle cx="44" cy="46" r="2" fill="#59ffb0" opacity="0.9"/>
  <circle cx="84" cy="48" r="2" fill="#59ffb0" opacity="0.9"/>
  <circle cx="76" cy="94" r="2" fill="#59ffb0" opacity="0.7"/>
  <circle cx="48" cy="90" r="2" fill="#59ffb0" opacity="0.7"/>
  <circle cx="64" cy="34" r="1.5" fill="#59ffb0" opacity="0.6"/>
  <circle cx="94" cy="74" r="1.5" fill="#59ffb0" opacity="0.6"/>
  <circle cx="34" cy="84" r="1.5" fill="#59ffb0" opacity="0.5"/>
</svg>
